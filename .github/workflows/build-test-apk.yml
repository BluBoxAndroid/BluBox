name: Build Test APK

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'ABI to build (arm64-v8a, armeabi-v7a, x86_64, x86)'
        required: false
        default: 'arm64-v8a'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode keystore
        run: echo "${{ secrets.RELEASE_KEYSTORE }}" | base64 -d > release.keystore

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          ALIAS_NAME: ${{ secrets.ALIAS_NAME }}
          ALIAS_PASS: ${{ secrets.ALIAS_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleOssRelease -x lintVitalOssRelease --no-daemon --max-workers=2

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: test-apk-${{ inputs.abi }}
          path: app/build/outputs/apk/oss/release/*.apk
